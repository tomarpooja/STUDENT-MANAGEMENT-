{% extends 'core/base.html' %}
{% block title %}Add Student{% endblock %}

{% block content %}
<h3 class="mb-4">Add Student</h3>

<div class="card-premium p-4 w-75 mx-auto">
    <form method="post" class="row g-3">
        {% csrf_token %}

        <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Course</label>
            <select name="course" class="form-select" required>
                <option selected disabled>Select course</option>
                {% for course in courses %}
                <option value="{{ course.id }}">{{ course.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-12 d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success btn-premium">Add Student</button>
            <a href="{% url 'student_list' %}" class="btn btn-secondary btn-premium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
