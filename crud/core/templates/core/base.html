
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

<meta charset="UTF-8">
<title>{% block title %}Admin Panel{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
    body {font-family:'Poppins',sans-serif; background:#f8fafc; color:#4b5563; margin:0;}
    /* Sidebar */
    .sidebar {
        position: fixed; top:0; left:0; height:100%; width:220px; background:#fff; color:#3b82f6; padding-top:20px; box-shadow:2px 0 15px rgba(0,0,0,0.1);
        display:flex; flex-direction:column;
    }
    .sidebar h4{text-align:center; margin-bottom:20px; font-weight:700;}
    .sidebar a{
        padding:15px 20px; text-decoration:none; color:#3b82f6; font-weight:600; margin:4px 10px; border-radius:8px; transition:0.3s;
    }
    .sidebar a:hover, .sidebar a.active{background:#3b82f6; color:white;}
    /* Main content */
    .main-content{margin-left:220px; padding:30px; min-height:100vh;}
    /* Cards */
    .card-premium{border-radius:15px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); transition:all 0.3s ease; cursor:pointer; background:white;}
    .card-premium:hover{transform:translateY(-5px) scale(1.02); box-shadow:0 15px 40px rgba(59,130,246,0.2);}
    .card-blue{background:#3b82f6; color:white;}
    /* Buttons */
    .btn-premium{border-radius:25px; font-weight:600; transition:0.3s;}
    .btn-premium:hover{transform:scale(1.05);}
    /* Table hover */
    table tr:hover{background:rgba(59,130,246,0.1);}
    label{font-weight:600;}
    input, select{border-radius:10px;}
</style>
</head>
<body>

<div class="sidebar">
    <h4>Admin Panel</h4>
    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{% url 'student_list' %}" class="{% if request.resolver_match.url_name == 'student_list' %}active{% endif %}">Students</a>
    <a href="{% url 'course_list' %}" class="{% if request.resolver_match.url_name == 'course_list' %}active{% endif %}">Courses</a>
    <a href="{% url 'logout' %}">Logout</a>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
