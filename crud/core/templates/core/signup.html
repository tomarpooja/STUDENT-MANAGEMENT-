{% extends 'core/base.html' %}
{% block title %}Signup{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card-premium">
        <h3 class="text-center mb-3">Signup</h3>

        {% for message in messages %}
            <p class="text-danger text-center">{{ message }}</p>
        {% endfor %}

        <form method="post">
            {% csrf_token %}
            <input class="form-control mb-2" name="first_name" placeholder="First Name" required>
            <input class="form-control mb-2" name="last_name" placeholder="Last Name" required>
            <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
            <input class="form-control mb-2" type="password" name="password" placeholder="Password" required>
            <input class="form-control mb-3" type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button class="btn btn-success w-100">Signup</button>
            <a href="{% url 'login' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
