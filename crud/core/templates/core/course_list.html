{% extends 'core/base.html' %}
{% block title %}Courses{% endblock %}

{% block content %}
<h3 class="mb-4">Courses</h3>

<!-- Add Course Form -->
<div class="card-premium mb-4 p-4">
    <form method="post" class="row g-3 align-items-center">
        {% csrf_token %}
        <div class="col-md-8">
            <input type="text" name="name" class="form-control" placeholder="Enter Course Name" required>
        </div>
        <div class="col-md-4 d-flex gap-2">
            <button type="submit" class="btn btn-success btn-premium w-100">Add Course</button>
            <a href="#" class="btn btn-secondary btn-premium w-100" onclick="this.closest('form').reset();return false;">Cancel</a>
        </div>
    </form>
</div>

<!-- Course Table -->
<div class="card-premium p-3">
    <table class="table table-hover align-middle mb-0 text-dark">
        <thead>
            <tr class="bg-light">
                <th class="fw-bold">Course Name</th>
                <th class="fw-bold text-center" style="width: 150px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr class="table-row-hover">
                <td>{{ course.name }}</td>
                <td class="text-center">
                    <a href="{% url 'delete_course' course.id %}" class="btn btn-danger btn-sm btn-premium">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center">No courses found</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
